syntax = "proto3";

// OWNED BY THE IAM SERVICE. IAM owns tenants; other services (order first) ask
// for the few tenant settings they need instead of copying them.
package zerpto.iam.v1;

// Settings of a tenant.
service Tenants {
  // The settings of one tenant. Answered from live data (no cache) and changes
  // nothing. A tenant IAM does not know is a normal answer, not a gRPC error.
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse);
}

// Asks about one tenant.
message GetTenantRequest {
  // Id of the tenant (plain lowercase UUID, no `ten-` prefix).
  string tenant_id = 1;
}

// The tenant's settings.
message GetTenantResponse {
  // True when IAM has this tenant.
  bool found = 1;
  // ISO 4217 code of the tenant's base currency, for example "IDR". IAM applies
  // its default when the tenant has not chosen one. Empty when `found` is false.
  string base_currency = 2;
}
